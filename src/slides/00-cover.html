<main class="slide" data-page="1" data-step="0" id="slide" tabindex="-1" aria-label="Scientific talk cover">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="micro-grid" aria-hidden="true"></div>
    <div class="network-stage" id="network-stage" aria-hidden="true">
      <svg id="network" viewBox="0 0 1100 860" role="img" aria-label="An animated scientific network with seeded activation cascades and brief RGB-split glitches that reveal temporary planted edges">
        <defs>
          <radialGradient id="node-halo"><stop offset="0" stop-color="#6ee8ed" stop-opacity=".64"/><stop offset=".40" stop-color="#58d1e3" stop-opacity=".14"/><stop offset="1" stop-color="#58d1e3" stop-opacity="0"/></radialGradient>
          <radialGradient id="anomaly-halo"><stop offset="0" stop-color="#ffb18b" stop-opacity=".65"/><stop offset=".35" stop-color="#ff886f" stop-opacity=".17"/><stop offset="1" stop-color="#ff886f" stop-opacity="0"/></radialGradient>
          <filter id="subtle-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
        </defs>
        <g id="base-network"><g id="edges" class="edges"></g><g id="nodes" class="nodes"></g></g>
        <g id="signals" class="signals"></g>
        <g id="anomalies" class="anomalies"></g>
        <g id="glitch-overlay" class="glitch-overlay"></g>
      </svg>
    </div>
    <div class="network-wash" aria-hidden="true"></div>

    <header class="eyebrow">
      <span class="eyebrow-dot"></span>
      <span>__COVER_EYEBROW__</span>
      <span class="eyebrow-divider"></span>
      <span>__COVER_INSTITUTION__</span>
    </header>

    <section class="hero">
      <div class="hero-kicker"><span class="kicker-line"></span> __COVER_AREAS__</div>
      <h1>__COVER_TITLE__</h1>
      <p class="speaker">__COVER_SPEAKER_FIRST__ <strong>__COVER_SPEAKER_LAST__</strong></p>
      <div class="speaker-rule"></div>
      <p class="speaker-detail">__COVER_SEMINAR__ <span class="small-dot">·</span> __COVER_DEPARTMENT__</p>
    </section>

    <footer class="footer">
      <div class="footer-right"><span class="footer-numeral">01</span><span class="footer-slash">/</span><span>OPENING</span></div>
    </footer>
